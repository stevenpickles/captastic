# Performance budgets for the documented benchmark host.
#
# These are claims about hardware, not about correctness, which is why they live here rather than
# in the test suite. Hosted CI runs on a software adapter and would breach every GPU figure below
# on every run; a check that always fails is a check nobody reads, so `captastic benchmark
# --budgets` skips a budget whose host does not match the run and says so rather than passing it.
#
# Reproducing a run these apply to:
#
#   captastic benchmark --backend dxgi --cursor exclude --repeat 3 --iterations 200 \
#       --budgets benchmarks/budgets.toml
#
# from a *console* session. A Remote Desktop session composes onto a virtual display adapter that
# DXGI will not duplicate, so a run started over RDP measures nothing and reports why.

[host]
# Prose, for the message rather than the comparison: it is what a reader sees when a budget is
# skipped, and nothing below is derived from it. Every field that is actually matched is named
# separately, because a description that drifted out of step with the checks would describe a host
# the budgets no longer apply to and nobody would find out.
description = "the documented benchmark host: RTX 3070, Dell U2720Q at 3840x2160, release build"
backend = "dxgi"
mode = "latest"
cursor = "exclude"
# A synthetic run's timings are configured rather than measured, so a budget would be judging its
# own inputs.
synthetic = false
# A debug build is slower by a margin no budget should absorb.
debug_assertions = false
display_resolution = "3840x2160"
# A fragment of the adapter's name, matched case-insensitively against every adapter the host
# enumerates. A fragment rather than the full marketing name, which a driver package is free to
# reword: a budget that silently stopped applying after a driver update would be worse than none.
gpu = "RTX 3070"
# A console session. Remote Desktop composes onto a virtual adapter DXGI will not duplicate, and a
# locked session measures a desktop nobody is looking at; the hardware being identical does not
# make either of them this host.
session = "interactive"
# Mains power. The same machine clocks down on battery, and the figures below were not measured
# there.
power_source = "ac"
# The run must have gone through a real GPU. This is the field that keeps these ceilings from being
# judged on a hosted CI runner, where every acquisition figure describes a CPU emulating a GPU.
# Matched against the adapter driving the run's displays, not against every adapter enumerated:
# this desktop also enumerates the Microsoft Basic Render Driver, as every desktop does. It needs
# `synthetic = false` above to mean anything: a synthetic run went through no adapter at all, and
# is reported as unjudgeable on this field rather than matched against the hardware it ran beside.
software_adapter = false
# Also available and deliberately unset, because these ceilings are not calibrated to them yet:
#   driver_version = "32.0.15.9186"   # exact, for pinning a calibration while chasing a regression
#   cpu = "Ryzen 9 5900X"             # case-insensitive substring
#   os_build = "26200"                # prefix, so a monthly revision does not unpin the budget

# Ceilings in nanoseconds.
#
# Left unset until measured on the host from a console session. An invented number is worse than an
# absent one: it either passes trivially and protects nothing, or fails honestly and gets deleted.
# The relative budgets below need no such calibration, which is why they are populated first.
[absolute]
# native_frame_p50_ns = ...
# native_frame_p99_ns = ...
# cpu_frame_p50_ns = ...
# cpu_frame_p99_ns = ...
# trigger_to_dequeue_p99_ns = ...

# Ceilings expressed against the run itself.
#
# These survive a hardware change, which absolute numbers do not: "the tail is within 6x the
# median" still means something on a machine twice as fast, while "p99 under 3 ms" quietly stops
# testing anything. They also catch the regression that matters most for a capture tool — a long
# tail that a median hides, felt by the user as an occasional stutter.
[relative]
native_p99_over_p50 = 6.0
cpu_p99_over_p50 = 6.0
failure_percent = 0.0
