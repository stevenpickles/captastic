schema_version = 1

[daemon]
backend = "dxgi"
display = "pointer"
# Use "primary" to always target the Windows primary monitor.
# Use "virtual_desktop" to compose every display when they share one DXGI adapter.
# To select one monitor, run `captastic displays --backend dxgi --json` and use:
# display = "display:windows-monitor-0123456789abcdef"
trigger_queue_capacity = 4

[hotkey]
# "coalesce" is not implemented yet (roadmap milestone 4); repeat must remain "ignore".
repeat = "ignore"

# Omit an action to leave it disabled. The default registers only last_workflow.
[hotkey.bindings]
last_workflow = "Ctrl+Shift+F9"
# region = "Ctrl+Shift+R"
# window = "Ctrl+Shift+W"
# full_display = "Ctrl+Shift+F10"
# repeat_last_region = "Ctrl+Shift+F11"

[capture]
mode = "latest"
fresh_timeout_ms = 100
max_frame_age_ms = 0
cpu_frame = true
# "include" composites the mouse pointer into the capture, shape and all. It is off by default
# because a screenshot of a window is usually wanted without a cursor sitting in it.
cursor = "exclude"
# The base of the CPU readback pool, currently fixed at three slots; buffer_slots must remain 3.
# When selection is enabled the engine adds slots of its own on top of this base - an open overlay
# holds the frame from its hotkey press for the whole interaction, and the selection queue can
# hold more behind it - so there is nothing here to tune for it.
buffer_slots = 3
fake_width = 64
fake_height = 64
fake_native_delay_us = 250
fake_readback_delay_us = 250
fake_frame_age_us = 1000

[selection]
enabled = true
queue_capacity = 1
# Every press of an overlay hotkey captures the screen at that moment, and the overlay can show
# either those pixels or the live desktop. Press F (or use Options -> View) to switch; confirming
# captures whichever view is showing. This setting chooses only which view the overlay *opens* in,
# per run - the switch is never remembered.
#   "auto"   (default) opens live, and if the layered presenter cannot be established it reopens
#            the same run showing the captured frame instead, with the switch unavailable.
#   "live"   opens live and fails rather than silently showing trigger-time pixels.
#   "frozen" opens on the frame captured at the press.
# The Window tool is unaffected either way: clicking a preview always renders that window fresh.
preview = "auto"

[clipboard]
enabled = true
queue_capacity = 1
# A capture is whatever was on screen, so by default Captastic asks Windows to keep it out of the
# Win+V clipboard history and to leave it off the sync to your Microsoft account. Set either to
# true to opt back in; an ordinary paste works the same either way.
allow_history = false
allow_cloud_sync = false

[output]
# Write every capture to disk, alongside the clipboard or instead of it.
# Also a notification-area command: "Save Captures to Disk" starts and stops writing without a
# restart and writes your choice back here. The settings below it are read at startup only.
enabled = false
# "png", "jpeg", or "bmp".
#   png  - lossless and compressed, and it keeps the transparent corners and shadow of a window
#          capture. The default, and the right answer for a screenshot of text or an interface.
#   jpeg - lossy and much smaller, written with a .jpg extension. Worth it for a photograph, a map,
#          or a video frame; it rings along the hard edges that make up most of a screenshot.
#   bmp  - uncompressed, keeps alpha, and large: a 4K capture is 33 MB and stays that way. Useful
#          where a tool has to read the file without a decoder.
# JPEG cannot carry an alpha channel at all, so the transparent pixels of a window capture are
# composited over opaque white. That is inherent to the format rather than a choice Captastic
# makes on your behalf, and the log says so at debug level each time it happens - but if you
# capture windows and want their corners and shadows, use "png" or "bmp".
format = "png"
# How hard a JPEG is compressed, 1-100. Ignored by the other two formats. 90 keeps the text in a
# screenshot legible; much below 70 the ringing around hard edges becomes easy to see.
jpeg_quality = 90
queue_capacity = 2
# Absolute path. Omit to use <home>/Pictures/Captastic. A daemon's working directory is whatever
# launched it, so a relative path would put captures somewhere you could not predict.
# directory = 'C:\Users\you\Pictures\Captastic'
# Names each capture, without the extension. Tokens: {timestamp} {date} {time} {display} {mode}
# {width} {height} {application} {title}. Values coming from a window are sanitized, and a name can
# never place a capture outside the directory above.
#
# The default leads with the timestamp so captures sort chronologically, then says what was
# captured. Both window tokens expand to nothing for a display or region capture, leaving the
# timestamp alone. A window title is content — document names, ticket titles, URLs — and a filename
# shows up in file pickers, backup indexes, and directory listings. Use "{timestamp}" alone, or
# "{timestamp}-{application}", if that is more than you want a name to say.
filename_template = "{timestamp}-{application}-{title}"

[history]
# How many recent captures to remember, so they can be reopened later. Zero turns history off.
max_items = 50
# Forget captures older than this many days. Zero means age is not a reason to forget.
max_age_days = 30
# Forget the oldest once remembered captures exceed this many bytes. Zero disables the limit.
max_total_bytes = 0

[metrics]
enabled = true
ring_capacity = 10000
raw_events = false

[logging]
level = "info"
format = "compact"
# file = "C:/Users/you/.captastic/logs/captastic.log"
max_file_bytes = 5242880
retained_files = 3

# Legacy, and inert on any installation that has run since remembered state moved out of this file.
#
# Captastic keeps what it remembers about how you last used it - toolbar position, last tool, last
# region, per display - in its own state.toml beside this file. This section is read exactly once,
# to carry a pre-split installation's values across, and is ignored from then on. It is left in
# place rather than deleted because this file is yours; it is safe to remove, and Captastic says so
# at startup if it finds one that no longer does anything.
#
# Everything below is kept only to document what those pre-split values looked like.
[ui]
# overlay_x = 640
# overlay_y = 920
# last_capture_tool = "region"

# [ui.last_region]
# x = 480
# y = 270
# width = 960
# height = 540

# Captastic creates one of these tables for each monitor as the overlay is used. Toolbar and region
# coordinates are local to the monitor, not the Windows virtual desktop. Toolbar center values are
# normalized within the monitor work area so they survive DPI, taskbar, and resolution changes.
# [ui.displays.windows-monitor-0123456789abcdef]
# overlay_center_x = 0.5
# overlay_center_y = 0.9
# last_capture_tool = "region"

# [ui.displays.windows-monitor-0123456789abcdef.last_region]
# x = 480
# y = 270
# width = 960
# height = 540

# [ui.displays.windows-monitor-0123456789abcdef.last_region_source]
# width = 1920
# height = 1080
# rotation_degrees = 0

# Confirmed regions are separate from cancellation-restored interaction regions and are managed by
# Captastic for repeat_last_region. Do not copy these values between displays.
# [ui.displays.windows-monitor-0123456789abcdef.last_confirmed_region]
# x = 480
# y = 270
# width = 960
# height = 540
#
# [ui.displays.windows-monitor-0123456789abcdef.last_confirmed_region_source]
# width = 1920
# height = 1080
# rotation_degrees = 0
