[package]
name = "captastic-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The image formats are named here and implemented there, and one enum is better than a mapping
# table two crates have to keep in step. The dependency runs config -> core, never the reverse.
captastic-core = { path = "../captastic-core" }
log.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
