name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-package:
    name: Windows release package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Build distribution binaries
        run: cargo build --locked --profile dist --workspace

      - name: Assemble portable package
        id: portable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          $archive = ./scripts/package-windows.ps1 -Version $version
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/v*') {
            $packageVersion = "${{ github.ref_name }}".TrimStart('v')
            $sourceUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(Split-Path -Leaf '${{ steps.portable.outputs.archive }}')"
          } else {
            $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
            $packageVersion = "$($metadata.workspace_packages[0].version)-ci.${{ github.run_number }}"
            $sourceUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          ./scripts/package-chocolatey.ps1 `
            -Version $packageVersion `
            -ArchivePath '${{ steps.portable.outputs.archive }}' `
            -SourceUrl $sourceUrl

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: captastic-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
            dist/*.nupkg
