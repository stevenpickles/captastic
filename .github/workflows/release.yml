name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-package:
    name: Windows release package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Build distribution binaries
        run: cargo build --locked --profile dist --workspace

      - name: Assemble portable package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          $packageName = "captastic-$version-windows-x86_64"
          $packageDirectory = Join-Path $PWD "dist/$packageName"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item target/dist/captastic.exe $packageDirectory
          Copy-Item target/dist/captastic-desktop.exe $packageDirectory
          Copy-Item captastic.example.toml $packageDirectory
          Copy-Item README.md $packageDirectory
          Copy-Item LICENSE-MIT $packageDirectory
          Copy-Item LICENSE-APACHE $packageDirectory
          Copy-Item scripts/install.ps1 $packageDirectory
          Copy-Item scripts/uninstall.ps1 $packageDirectory
          $archive = Join-Path $PWD "dist/$packageName.zip"
          Compress-Archive -Path $packageDirectory -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: captastic-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
