name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-package:
    name: Windows release package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Resolve and verify package version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object {
            $_.targets.name -contains 'captastic'
          } | Select-Object -First 1
          if ($null -eq $package) {
            throw 'cargo metadata did not contain the captastic binary target'
          }
          $workspaceVersion = "$($package.version)"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $workspaceVersion) {
              throw "Release tag $env:GITHUB_REF_NAME does not match Cargo.toml version $workspaceVersion"
            }
            $packageVersion = $tagVersion
          } else {
            $packageVersion = "$workspaceVersion-ci.$env:GITHUB_RUN_NUMBER"
          }
          "value=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Build distribution binaries
        run: cargo build --locked --profile dist --workspace

      - name: Assemble portable package
        id: portable
        shell: pwsh
        run: |
          $archive = ./scripts/package-windows.ps1 `
            -Version '${{ steps.version.outputs.value }}' `
            -Architecture x86_64
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/v*') {
            $sourceUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(Split-Path -Leaf '${{ steps.portable.outputs.archive }}')"
          } else {
            $sourceUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          ./scripts/package-chocolatey.ps1 `
            -Version '${{ steps.version.outputs.value }}' `
            -ArchivePath '${{ steps.portable.outputs.archive }}' `
            -SourceUrl $sourceUrl

      - name: Upload portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: captastic-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
            dist/*.nupkg
