name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Reject compiler and Clippy warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Build distribution workspace
        run: cargo build --locked --profile dist --workspace

      - name: Validate Windows and Chocolatey packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = "$($metadata.packages[0].version)-ci.${{ github.run_number }}"
          $outputDirectory = Join-Path $PWD 'dist/ci'
          $archive = ./scripts/package-windows.ps1 `
            -Version $version `
            -Architecture x86_64 `
            -BinariesDirectory target/dist `
            -OutputDirectory $outputDirectory
          ./scripts/package-chocolatey.ps1 `
            -Version $version `
            -ArchivePath $archive `
            -OutputDirectory $outputDirectory `
            -SourceUrl "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  coverage:
    name: Windows HTML coverage
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.97.1 with LLVM coverage tools
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-llvm-cov
          fallback: none

      - name: Generate HTML coverage
        run: cargo llvm-cov --locked --workspace --html --output-dir coverage

      - name: Upload HTML coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: captastic-coverage-html
          path: coverage/html
          if-no-files-found: error
          retention-days: 14

  windows-arm64-check:
    name: Windows ARM64 compile check
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.97.1 with ARM64 target
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-pc-windows-msvc

      - name: Check ARM64 workspace
        run: cargo check --locked --workspace --all-targets --target aarch64-pc-windows-msvc
