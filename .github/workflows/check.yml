name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Reject compiler and Clippy warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release workspace
        run: cargo build --release --workspace

  coverage:
    name: Windows HTML coverage
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust 1.97.1 with LLVM coverage tools
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
          fallback: none

      - name: Generate HTML coverage
        run: cargo llvm-cov --workspace --html --output-dir coverage

      - name: Upload HTML coverage
        uses: actions/upload-artifact@v7
        with:
          name: captastic-coverage-html
          path: coverage/html
          if-no-files-found: error
          retention-days: 14
